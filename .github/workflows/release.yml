name: Windows Build and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("app/mygo.json", encoding="utf-8"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Test distribution contracts
        run: python -m unittest discover -s app/tests -p 'test_*.py' -v
      - name: Restore SDK cache
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: app/sdk/installed
          key: windows-vcpkg-sdk-v1-${{ hashFiles('app/sdk/vcpkg.json', 'app/sdk/triplets/**') }}
      - name: Prepare Windows SDK
        shell: pwsh
        run: |
          git init app/sdk/toolchain
          git -C app/sdk/toolchain remote add origin https://github.com/microsoft/vcpkg.git
          git -C app/sdk/toolchain fetch --depth 1 origin 84bab45d415d22042bd0b9081aea57f362da3f35
          git -C app/sdk/toolchain checkout FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ steps.sdk.outputs.cache-hit }}' -ne 'true') {
            & app/sdk/toolchain/bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $common = @('--triplet', 'x64-windows', '--overlay-triplets=app/sdk/triplets', '--x-install-root=app/sdk/installed', '--classic')
            & app/sdk/toolchain/vcpkg.exe install libpng libjpeg-turbo 'tiff[core,zip]' 'libxml2[core]' 'sqlite3[core,tool]' @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & app/sdk/toolchain/vcpkg.exe install 'osg[core]' @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "OSGB_SDK=$((Resolve-Path app/sdk/installed/x64-windows).Path)" >> $env:GITHUB_ENV
      - name: Save SDK cache
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/sdk/installed
          key: windows-vcpkg-sdk-v1-${{ hashFiles('app/sdk/vcpkg.json', 'app/sdk/triplets/**') }}
      - name: Build, test and verify portable runtime
        shell: bash
        run: |
          python app/scripts/build.py --sdk-prefix "$OSGB_SDK" --skip-desktop --toolchain app/sdk/toolchain/scripts/buildsystems/vcpkg.cmake
          python app/scripts/build.py --verify-package app/dist/windows-amd64/portable
          input=$(python -c "from pathlib import Path; print(next(Path('app/build').glob('*/test-data-*/texture+alpha.osgb')).resolve(), end='')")
          python app/tests/verify_parity.py --package app/dist/windows-amd64/portable --input "$input" --srs ENU:31.2,121.4,10 --evidence .agents-debug/ci/parity
      - name: Package desktop build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: app
        run: go tool mygo build --platform windows/amd64
      - name: Package signed release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY"
          go tool mygo build --platform windows/amd64
      - name: Verify Windows installer and portable package
        shell: bash
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          python app/scripts/build.py --finalize-package app/dist/windows-amd64
          python app/tests/verify_windows_package.py --package app/dist/windows-amd64
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            app/dist/windows-amd64/osgb-tiles-setup-*.exe
            app/dist/windows-amd64/*-windows-amd64.tar.gz
            app/dist/windows-amd64/update-windows-amd64.json
            app/dist/windows-amd64/*-windows-amd64.delta
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows-package
          path: app/dist/windows-amd64/

  release:
    name: Stage Windows release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Upload verified files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          test -s "release-assets/osgb-tiles-setup-$version-amd64.exe"
          test -s "release-assets/osgb-tiles-$version-windows-amd64.tar.gz"
          test -s release-assets/update-windows-amd64.json
          if ! gh release view "$tag" >/dev/null 2>&1; then
            awk -v heading="## $version" '$0 == heading {found=1; next} found && /^## / {exit} found {print}' app/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" --verify-tag --draft --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" release-assets/* --clobber
