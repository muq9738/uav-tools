<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>景构 · 实景建模工作台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand" aria-label="景构">
      <svg class="brand-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <path d="m18 4 13 7.5v13L18 32 5 24.5v-13L18 4Z" stroke="currentColor" stroke-width="1.6"/>
        <path d="m5 11.5 13 7.4 13-7.4M18 18.9V32" stroke="currentColor" stroke-width="1.6"/>
        <path d="m11.5 8 13 7.4v6.8" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
      </svg>
      <span>景构</span>
    </div>

    <nav class="navigation" aria-label="主导航">
      <div class="nav-section">
        <div class="nav-label">工作空间</div>
        <button class="nav-item rail-item active" data-view="tasks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
          <span>工作台</span>
        </button>
        <button class="nav-item" disabled title="照片建模功能规划中">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 7 9.5 4h5L16 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>照片建模</span><span class="nav-tag">规划中</span>
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-label">工具</div>
        <button class="nav-item" id="sidebar-add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 5H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-3M14 5h5v5M19 5l-9 9"/><path d="M4 16h5v4"/></svg>
          <span>格式转换</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <button class="nav-item" id="sidebar-update" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.6M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.6M20 20v-4h-4"/></svg>
        <span>检查更新</span><span class="nav-tag update-tag" id="sidebar-update-tag" hidden></span>
      </button>
      <button class="nav-item rail-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7a7 7 0 0 0-.8-1.8l.9-1.9L15 4l-1.9.9a7 7 0 0 0-1.8-.8L10.5 2h-3l-.7 2a7 7 0 0 0-1.8.8L3.1 4 1 6.1 1.9 8a7 7 0 0 0-.8 1.8l-2 .7v3l2 .7a7 7 0 0 0 .8 1.8L1 17.9 3.1 20 5 19.1a7 7 0 0 0 1.8.8l.7 2h3l.7-2a7 7 0 0 0 1.8-.8l1.9.9 2.1-2.1-.9-1.9a7 7 0 0 0 .8-1.8l2-.7Z" transform="translate(2.5 0) scale(.8)"/></svg>
        <span>运行环境</span>
      </button>
      <div class="workspace-meta"><span class="local-dot"></span><span>本地工作区</span><span class="version" id="app-version">v0.6.1</span></div>
    </div>
  </aside>

  <main class="main">
    <section id="view-tasks" class="view">
      <header class="page-head">
        <h1>转换任务</h1>
        <div class="page-actions">
          <button id="refresh" class="icon-btn" title="刷新" aria-label="刷新任务列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
          </button>
          <button id="add" class="primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            新建转换
          </button>
        </div>
      </header>

      <div class="task-panel">
        <div class="list-toolbar">
          <div class="list-title">全部任务 <span id="task-count" class="count">0</span></div>
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></svg>
            <input id="search" type="search" placeholder="搜索任务或路径" aria-label="搜索任务">
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th class="col-name">任务</th><th class="col-state">状态</th><th class="col-time">耗时</th><th class="col-path">输出位置</th><th class="col-ops">操作</th></tr></thead>
            <tbody id="jobs"></tbody>
          </table>
          <div id="empty" class="empty" hidden>
            <svg class="empty-visual" viewBox="0 0 200 140" fill="none" aria-hidden="true">
              <g stroke="currentColor" stroke-width="1.2">
                <path d="m100 18 70 39-70 39-70-39 70-39Z" fill="var(--accent-soft)"/>
                <path d="m30 57 70 39 70-39M100 96v26M52 73l70 39 48-27M52 41l70 39 26-14" opacity=".55"/>
                <path d="m30 77 70 39 70-39M30 97l70 39 70-39" opacity=".32"/>
                <path d="m66 50 34-19 34 19-34 19-34-19Z" fill="var(--surface)"/>
                <path d="m66 50 34 19 34-19M100 69V50" opacity=".7"/>
              </g>
              <circle cx="149" cy="31" r="4" fill="var(--accent)"/>
              <circle cx="42" cy="102" r="3" fill="var(--accent)" opacity=".45"/>
            </svg>
            <h2 id="empty-title">还没有转换任务</h2>
            <p id="empty-description">选择 OSGB 数据，开始转换</p>
            <button class="primary" id="empty-add">新建转换</button>
          </div>
        </div>
      </div>
      <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
    </section>

    <section id="view-settings" class="view" hidden>
      <header class="page-head">
        <h1>运行环境</h1>
        <div class="page-actions">
          <button id="check-updates" class="secondary" hidden>检查更新</button>
          <span id="engine-chip" class="chip">检测中</span>
        </div>
      </header>
      <div id="doctor-body" class="doctor"></div>
    </section>
  </main>
</div>

<dialog id="new-job-dialog" class="dialog" aria-labelledby="new-job-title">
  <div class="dialog-head">
    <div><span class="dialog-kicker">格式转换</span><h2 id="new-job-title">OSGB 转 3D Tiles</h2></div>
    <button class="close" data-close="new-job-dialog" aria-label="关闭">×</button>
  </div>
  <form id="new-job" autocomplete="off">
    <div class="form-content">
      <div class="field">
        <label for="input">输入数据</label>
        <div class="row"><input id="input" type="text" required placeholder="OSGB 目录或 .osgb 文件"><button type="button" class="secondary pick" data-target="input" hidden>选择目录</button></div>
      </div>
      <div class="field">
        <label for="output">输出位置</label>
        <div class="row"><input id="output" type="text" required placeholder="3D Tiles 输出目录"><button type="button" class="secondary pick" data-target="output" hidden>选择目录</button></div>
      </div>
      <div class="field"><label for="generatePreview"><input id="generatePreview" type="checkbox" checked> 生成轻量预览</label><span class="note">流式多级 LOD、量化 Meshopt 几何、原画质纹理；低配流畅且不影响保真 3D Tiles</span></div>
      <details class="advanced">
        <summary><span>高级设置</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></summary>
        <div class="advanced-grid">
          <div class="field"><label for="threads">线程数</label><input id="threads" type="number" min="1" max="64" value="2"></div>
          <div class="field"><label for="geometry">几何编码</label><select id="geometry"><option value="meshopt">Meshopt（默认）</option><option value="raw">原始数组</option><option value="draco">Draco</option></select></div>
          <div class="field"><label for="memoryBudgetMiB">内存预算（MiB）</label><input id="memoryBudgetMiB" type="number" min="0" step="1" value="0" placeholder="0 为不限"></div>
          <div class="field"><label for="dracoSpeed">Draco 压缩</label><select id="dracoSpeed"><option value="5">平衡</option><option value="0">质量优先</option><option value="10">速度优先</option></select></div>
          <div class="field"><label for="textureFormat">纹理编码</label><select id="textureFormat"><option value="original">原始纹理</option><option value="uastc">KTX2 · UASTC</option><option value="etc1s">KTX2 · ETC1S</option></select></div>
          <div class="field"><label for="rebuildTop">顶层重建</label><select id="rebuildTop"><option value="false">保留原层级</option><option value="true">生成远景层</option></select></div>
          <div class="field"><label for="topSealDistance">焊缝距离（米）</label><input id="topSealDistance" type="number" min="0" max="2" step="0.05" value="2"></div>
          <div class="field"><label for="srs">坐标系</label><input id="srs" type="text" placeholder="自动识别"></div>
          <div class="field"><label for="origin">模型原点</label><input id="origin" type="text" placeholder="自动"></div>
        </div>
      </details>
    </div>
    <div class="dialog-foot">
      <span id="form-message" class="message" role="status" aria-live="polite"></span>
      <button type="button" class="secondary" data-close="new-job-dialog">取消</button>
      <button id="submit" type="submit" class="primary">开始转换</button>
    </div>
  </form>
</dialog>

<dialog id="detail-dialog" class="dialog wide" aria-labelledby="detail-title">
  <div class="dialog-head"><div><span class="dialog-kicker">转换任务</span><h2 id="detail-title">任务详情</h2></div><button class="close" data-close="detail-dialog" aria-label="关闭">×</button></div>
  <div id="detail-body" class="detail-body"></div>
</dialog>

<dialog id="preview-dialog" class="preview-dialog" aria-label="3D Tiles 模型预览">
  <iframe id="preview-frame" title="Cesium 3D Tiles 模型预览" allowfullscreen></iframe>
</dialog>

<dialog id="error-dialog" class="dialog small" aria-labelledby="error-title">
  <div class="dialog-head"><div><h2 id="error-title">提示</h2></div><button class="close" data-close="error-dialog" aria-label="关闭">×</button></div>
  <p id="error-body" class="error-text"></p>
  <div class="dialog-foot"><button class="primary" data-close="error-dialog">知道了</button></div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
